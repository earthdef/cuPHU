[build-system]
requires = ["scikit-build-core>=0.9", "pybind11>=2.12"]
build-backend = "scikit_build_core.build"

[project]
name = "cuphu"
authors = [
  { name = "Lijun Zhu", email = "fdboy007@gmail.com" },
]
description = "GPU-accelerated SNAPHU phase unwrapping with Python wrapper"
readme = "README.md"
keywords = [
  "cuda",
  "gpu",
  "insar",
  "phase-unwrapping",
  "radar",
  "remote-sensing",
  "sar",
  "synthetic-aperture-radar",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python",
  "Programming Language :: C++",
  "Topic :: Scientific/Engineering",
]
requires-python = ">=3.9"
dependencies = ["numpy>=1.20"]
dynamic = ["version"]

[project.optional-dependencies]
raster = ["rasterio>=1.2"]
test   = ["pytest>=7", "pytest-cov>=4", "scipy>=1.10"]

[project.urls]
Homepage = "https://github.com/isce-framework/cuPHU"
Issues   = "https://github.com/isce-framework/cuPHU/issues"

# ── scikit-build-core ─────────────────────────────────────────────────────────
[tool.scikit-build]
metadata.version.provider = "scikit_build_core.metadata.setuptools_scm"
cmake.build-type = "Release"
wheel.packages = ["src/cuphu"]

[tool.setuptools_scm]
write_to = "src/cuphu/_version.py"
local_scheme = "no-local-version"

# ── pytest ────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
addopts     = ["-ra", "--showlocals", "--strict-markers", "--strict-config"]
testpaths   = ["test"]
log_cli_level = "INFO"

# ── mypy ──────────────────────────────────────────────────────────────────────
[tool.mypy]
strict = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]

# ── ruff ──────────────────────────────────────────────────────────────────────
[tool.ruff.lint]
select = ["A", "ARG", "B", "C4", "D", "E", "W", "EM", "F", "I", "N", "PL", "PT", "UP"]
ignore = ["D100", "D104", "D105", "PLR"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"
